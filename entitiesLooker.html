<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Looker Studio Add-in</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f5f7;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <!-- Reemplaza la URL en src con tu URL de insercion (embed) de Looker Studio -->
    <iframe 
        src="https://datastudio.google.com/embed/reporting/7158f3ba-71fd-4722-a58a-8941cb0fe03f/page/p_2gydgfcu5d" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>

    <script>
        // Inicializador para MyGeotab
        geotab.addin.bimboEntities = function (api, state) {
            return {
                initialize: function (api, state, callback) {
                    callback();
                },
                focus: function (api, state) {
                },
                blur: function (api, state) {
                }
            };
        };
    </script>
</body>
</html>
