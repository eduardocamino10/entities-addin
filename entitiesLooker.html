<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Looker Studio Add-in</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f5f7;
        }
        
        /* Forzar al iframe a salirse del div restrictivo de Geotab */
        .full-screen-frame {
            position: fixed !important;
            top: 100px; /* Mantiene la barra superior de Geotab visible */
            left: 240px; /* Mantiene el menú lateral de Geotab visible */
            width: calc(100vw - 240px) !important;
            height: calc(100vh - 100px) !important;
            border: 0 !important;
            z-index: 99 !important;
        }

        /* Responsive: Si se colapsa el menú lateral de Geotab */
        @media (max-width: 900px) {
            .full-screen-frame {
                left: 60px;
                width: calc(100vw - 60px) !important;
            }
        }
    </style>
</head>
<body>
    <iframe 
        class="full-screen-frame"
        src="https://lookerstudio.google.com/embed/reporting/7158f3ba-71fd-4722-a58a-8941cb0fe03f/page/p_2gydgfcu5d" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>

    <script>
        geotab.addin.bimboEntities = function (api, state) {
            return {
                initialize: function (api, state, callback) {
                    callback();
                },
                focus: function (api, state) {
                },
                blur: function (api, state) {
                }
            };
        };
    </script>
</body>
</html>
