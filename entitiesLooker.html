<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looker Studio Add-in</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #f4f5f7;
        }
        
        /* Ocupa exactamente el 100% del área de trabajo asignada por Geotab */
        .full-screen-frame {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        class="full-screen-frame"
        src="https://lookerstudio.google.com/embed/reporting/7158f3ba-71fd-4722-a58a-8941cb0fe03f/page/p_2gydgfcu5d" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>

    <script>
        geotab.addin.bimboEntities = function (api, state) {
            return {
                initialize: function (api, state, callback) {
                    callback();
                },
                focus: function (api, state) {
                    // Fuerza un reflow del iframe cuando el usuario entra al menú
                    var iframe = document.querySelector('.full-screen-frame');
                    if (iframe) {
                        iframe.style.height = '100%';
                    }
                },
                blur: function (api, state) {
                }
            };
        };
    </script>
</body>
</html>
