<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looker Studio Add-in</title>
</head>
<body>
    <div id="bimbo-entities-root" style="width:100%; margin:0; padding:0;">
        <iframe
            id="bimbo-looker-frame"
            src="https://lookerstudio.google.com/embed/reporting/7158f3ba-71fd-4722-a58a-8941cb0fe03f/page/p_2gydgfcu5d"
            style="display:block; width:100%; height:calc(100vh - 90px); border:0;"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <script>
        geotab.addin.entitiesLooker = function (api, state) {
            function ajustar() {
                var f = document.getElementById('bimbo-looker-frame');
                if (f) {
                    var top = f.getBoundingClientRect().top;
                    f.style.height = (window.innerHeight - top - 10) + 'px';
                }
            }
            return {
                initialize: function (api, state, callback) {
                    window.addEventListener('resize', ajustar);
                    callback();
                },
                focus: function () { ajustar(); },
                blur: function () {}
            };
        };
    </script>
</body>
</html>
